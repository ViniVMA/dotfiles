# vim:ft=kitty

## name:     Vesper
## author:   palette by Rauno Freiberg (https://github.com/raunofreiberg/vesper)
## license:  MIT
## blurb:    Peppermint and orange flavored dark theme.

# Hand-maintained, deliberately NOT named current-theme.conf: that is the path
# `kitten themes` writes to, and it would overwrite this on the next run.
#
# Vesper is a VSCode theme with no terminal/ANSI palette of its own. kitty does
# bundle a "Vesper" (by theaaronn), but it collapses the palette to amber —
# color2 (green) == color4 (blue) == #ebb58c, and color6 (cyan) == color3
# (yellow) == #FFA500 — so git diffs, ls colors and syntax highlighting lose
# their hue distinctions. This file uses the real upstream colors instead.
# To see the bundled one for comparison: kitten themes --dump-theme Vesper
#
# Upstream hexes, verbatim from themes/Vesper-dark-color-theme.json, with the
# syntax role each plays:
#   #101010  editor.background
#   #FFFFFF  variable, entity.name.tag  (plain foreground)
#   #FFC799  accent — tags, warnings, git gutter  (the "orange")
#   #99FFE4  string, constant           (the "peppermint")
#   #FF8080  invalid.illegal, errors
#   #A0A0A0  keyword, storage.type
#   #8B8B8B  comment
#   #FF7300  hot orange (used once upstream)
#   #FFCFA8  lighter peach
#   #505050  editorLineNumber.foreground
#   surfaces: #161616 #1C1C1C #232323 #282828 #343434


# The basic colors
foreground              #FFFFFF
background              #101010
selection_foreground    #FFFFFF
# Upstream selection is #FFFFFF25 (14% white over #101010). Terminals need an
# opaque value, so this is that blend rounded to a real Vesper surface.
selection_background    #343434

# --- UI chrome accent --------------------------------------------------------
# Vesper's own accent is the peach #FFC799; this setup uses the palette's purple
# (#DDA0FF, same hex as color5 below) for chrome instead. Chrome accent is
# deliberately decoupled from the ANSI palette: color3/color11 stay peach so
# yellow still reads as yellow in warnings, ls and diffs.
# To go back to stock Vesper, set the four chrome values here + kitty.conf's
# active_tab_background + both accents in herdr/config.toml to #FFC799.

cursor                  #DDA0FF
cursor_text_color       #101010

url_color               #99FFE4

# Split / pane borders
active_border_color     #DDA0FF
inactive_border_color   #343434
bell_border_color       #FF8080

wayland_titlebar_color  system
macos_titlebar_color    system

# Tab bar. kitty.conf re-states active_tab_* after the include so the accent
# lives next to the other tab settings — edit it there, not here.
active_tab_foreground   #101010
active_tab_background   #DDA0FF
inactive_tab_foreground #A0A0A0
inactive_tab_background #1C1C1C
tab_bar_background      #101010

# Marks
mark1_foreground #101010
mark1_background #FFC799
mark2_foreground #101010
mark2_background #99FFE4
mark3_foreground #101010
mark3_background #FF8080


# --- The 16 terminal colors --------------------------------------------------

# black
color0  #101010
color8  #505050

# red — upstream error red; bright is upstream's hot orange
color1  #FF8080
color9  #FF7300

# green — the peppermint (Vesper's string color)
color2  #99FFE4
color10 #B3FFEA

# yellow — the accent peach; bright is upstream's lighter peach
color3  #FFC799
color11 #FFCFA8

# blue — EXTENSION. Vesper has no blue. Pinned to the same pastel register as
# #99FFE4 / #FFC799 (high lightness, low saturation) so it reads as one family.
# Not mapped to a gray because ANSI 4 is what ls uses for directories and most
# prompts use for paths — gray would make those indistinguishable from plain text.
color4  #99B8FF
color12 #B3CBFF

# magenta — EXTENSION, same reasoning as blue.
color5  #DDA0FF
color13 #E7B8FF

# cyan — EXTENSION. Kept bluer than color2 so mint and cyan stay distinct.
color6  #99EAFF
color14 #B3F0FF

# white — upstream keyword gray, brightening to plain foreground
color7  #A0A0A0
color15 #FFFFFF
